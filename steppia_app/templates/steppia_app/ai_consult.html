{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI相談室 - ステッピア</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #DCECCF;
            --bubble-ai: #F9F4E8;
            --bubble-user: #FFFFFF;
            --text-brown: #5D4037;
            --star-yellow: #FFF2AF;
            --heart-pink: #FFC1CC;
        }

        body {
            background-color: var(--bg);
            font-family: 'Zen Maru Gothic', sans-serif;
            margin: 0; padding: 0;
            min-height: 100dvh;
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-brown);
            overflow-x: hidden;
        }

        .main-wrapper {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            padding: 30px 15px 150px; /* 下部のナビと入力欄のための余白 */
            box-sizing: border-box;
        }

        /* --- ヘッダー --- */
        .header-area {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .header-logo { 
            width: 100px;
            height: auto; 
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        h1 { font-size: 24px; font-weight: 900; margin: 0; letter-spacing: 0.1em; }

        /* --- チャットエリア --- */
        .chat-container {
            width: 100%;
            display: flex; flex-direction: column; gap: 35px;
            margin-bottom: 20px;
        }

        .ai-row { display: flex; align-items: flex-end; gap: 10px; width: 100%; }
        .avatar-ai { 
            width: 60px; height: 60px; border-radius: 50%; 
            background: white; padding: 2px; flex-shrink: 0;
            box-shadow: 0 3px 6px rgba(0,0,0,0.08);
            object-fit: contain;
        }
        .ai-bubble {
            flex: 1; background: var(--bubble-ai); padding: 15px 20px;
            border-radius: 20px; border-bottom-left-radius: 2px;
            box-shadow: 0 4px 0 #E0DBC5; line-height: 1.6; font-weight: 700;
            font-size: 15px; position: relative;
        }

        .user-row { display: flex; justify-content: flex-end; align-items: flex-end; gap: 10px; width: 100%; }
        .user-bubble {
            max-width: 70%; background: var(--bubble-user); padding: 15px 20px;
            border-radius: 20px; border-bottom-right-radius: 2px;
            box-shadow: 0 4px 0 #D0D0D0; line-height: 1.6; font-weight: 700;
            font-size: 15px;
        }
        .avatar-user { 
            width: 65px; height: auto; flex-shrink: 0; object-fit: contain;
        }

        /* --- 入力エリア --- */
        .input-section {
            position: sticky; bottom: 100px; /* ナビボタンの上に配置 */
            width: 100%; max-width: 650px;
            margin-top: 40px;
            z-index: 100;
        }
        .input-card {
            background: var(--bubble-ai); border-radius: 40px; padding: 10px 15px;
            box-shadow: 0 6px 0 #E0DBC5; display: flex; align-items: center; gap: 10px;
        }
        textarea {
            flex: 1; border: none; outline: none; background: white;
            border-radius: 25px; padding: 12px 15px; font-family: inherit;
            font-size: 15px; font-weight: 700; resize: none; height: 45px;
            color: var(--text-brown);
        }

        .heart-btn {
            background: var(--heart-pink); width: 70px; height: 70px;
            display: flex; align-items: center; justify-content: center;
            border: none; cursor: pointer; flex-shrink: 0;
            font-weight: 900; color: var(--text-brown); font-size: 15px;
            clip-path: path('M35 60C-7 28-7 10 14 3.5 24.5 0 35 10 35 10s10.5-10 21-6.5C77 10 77 28 35 60Z');
            transition: 0.2s; padding-bottom: 8px;
        }
        .heart-btn:active { transform: scale(0.9); }

        /* --- 下部ナビゲーション --- */
        .bottom-nav {
            position: fixed; bottom: 5px; left: 0; width: 100%; 
            display: flex; justify-content: space-between; 
            padding: 0 5px; box-sizing: border-box; z-index: 1000;
            pointer-events: none;
        }
        
        .star-btn {
            text-decoration: none; position: relative; display: flex; 
            align-items: center; justify-content: center;
            width: 90px; height: 90px;
            pointer-events: auto; 
            transition: transform 0.2s ease-out;
        }

        .star-icon { 
            font-size: 90px; color: var(--star-yellow); 
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15)); line-height: 1;
        }

        .star-text {
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -45%) rotate(0deg);
            font-size: 16px; font-weight: 900; 
            color: #000; 
            white-space: nowrap;
            transition: transform 0.15s ease-out;
        }

        .star-btn:active .star-text {
            transform: translate(-40%, -65%) rotate(15deg);
        }

        .star-btn:active { transform: scale(0.95); }

        /* PC向け調整 */
        @media (min-width: 768px) {
            h1 { font-size: 30px; }
            .avatar-ai { width: 100px; height: 100px; }
            .avatar-user { width: 105px; }
            .ai-bubble, .user-bubble { font-size: 18px; }
            .input-section { bottom: 140px; }
            .input-card { padding: 15px 30px; }
            textarea { height: 60px; font-size: 18px; }
            .heart-btn { width: 100px; height: 100px; font-size: 20px; }
            .star-btn { width: 130px; height: 130px; }
            .star-icon { font-size: 130px; }
            .star-text { font-size: 22px; }
            .bottom-nav { left: 50%; transform: translateX(-50%); max-width: 800px; padding: 0 30px; bottom: 10px; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="header-area">
            <img src="{% static 'images/stepia_icon_clean_transparent.png' %}" class="header-logo" alt="ロゴ">
            <h1>AI相談室</h1>
        </div>

        <div class="chat-container">
            {% if user_q %}
            <div class="user-row">
                <div class="user-bubble">{{ user_q }}</div>
                <img src="{% static 'images/onna.png' %}" class="avatar-user">
            </div>
            {% endif %}

            <div class="ai-row">
                <img src="{% static 'images/otoko.png' %}" class="avatar-ai">
                <div class="ai-bubble">
                    {% if ai_answer %}
                        {{ ai_answer|linebreaksbr }}
                    {% else %}
                        こんにちは！就活やお仕事の悩み、何でも聞かせてくださいね。
                    {% endif %}
                </div>
            </div>
        </div>

        <div class="input-section">
            <div class="input-card">
                <form method="post" style="display: contents;">
                    {% csrf_token %}
                    <textarea name="user_input" placeholder="お悩みを入力してね..." required></textarea>
                    <button type="submit" class="heart-btn">相談</button>
                </form>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="{% url 'menu' %}" class="star-btn">
            <span class="star-icon">★</span>
            <span class="star-text">戻る</span>
        </a>
        <a href="{% url 'mypage' %}" class="star-btn">
            <span class="star-icon">★</span>
            <span class="star-text">履歴</span>
        </a>
    </div>

</body>
</html>
