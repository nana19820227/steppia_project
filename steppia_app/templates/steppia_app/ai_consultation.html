{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI相談室 - ステッピア</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #DCECCF;
            --bubble-ai: #F9F4E8;
            --bubble-user: #FFFFFF;
            --text-brown: #5D4037;
            --star-yellow: #FFF2AF;
            --heart-pink: #FFC1CC;
        }

        body {
            background-color: var(--bg);
            font-family: 'Zen Maru Gothic', sans-serif;
            margin: 0; padding: 0;
            min-height: 100dvh;
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-brown);
            overflow-x: hidden;
        }

        .main-wrapper {
            width: 100%;
            max-width: 600px; /* PCでの幅を少し絞ってバランスを整える */
            display: flex;
            flex-direction: column;
            padding: 15px 12px 160px; /* 下部ナビ用の余白 */
            box-sizing: border-box;
        }

        /* --- ヘッダー：極小化 --- */
        .header-area {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .header-logo { width: 80px; height: auto; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.06)); }
        h1 { font-size: 18px; font-weight: 900; margin: 0; letter-spacing: 0.05em; }

        /* --- チャットエリア --- */
        .chat-container { width: 100%; display: flex; flex-direction: column; gap: 20px; }

        .ai-row { display: flex; align-items: flex-end; gap: 8px; width: 100%; }
        .avatar { 
            width: 50px; height: 50px; border-radius: 50%; 
            background: white; padding: 2px; flex-shrink: 0;
            box-shadow: 0 3px 6px rgba(0,0,0,0.05); object-fit: contain;
        }
        .ai-bubble {
            flex: 1; background: var(--bubble-ai); padding: 10px 15px;
            border-radius: 18px; border-bottom-left-radius: 2px;
            box-shadow: 0 3px 0 #E0DBC5; line-height: 1.5; font-weight: 700;
            font-size: 13px; position: relative;
        }

        .user-row { display: flex; justify-content: flex-end; align-items: flex-end; gap: 8px; width: 100%; }
        .user-bubble {
            max-width: 75%; background: var(--bubble-user); padding: 10px 15px;
            border-radius: 18px; border-bottom-right-radius: 2px;
            box-shadow: 0 3px 0 #D0D0D0; line-height: 1.5; font-weight: 700;
            font-size: 13px;
        }

        /* --- 入力エリア --- */
        .input-section {
            position: fixed; bottom: 100px;
            width: 94%; max-width: 580px;
            z-index: 2000;
        }
        .input-card {
            background: var(--bubble-ai); border-radius: 35px; padding: 8px 10px;
            box-shadow: 0 5px 0 #E0DBC5; display: flex; align-items: center; gap: 8px;
            position: relative;
        }
        textarea {
            flex: 1; border: 1px solid #f0f0f0; outline: none; background: white;
            border-radius: 20px; padding: 10px 12px; font-family: inherit;
            font-size: 13px; font-weight: 700; resize: none; height: 42px;
            color: var(--text-brown); box-sizing: border-box;
        }

        /* ハートボタン：黄金比パスに修正 */
        .heart-btn {
            background: var(--heart-pink); width: 70px; height: 70px;
            display: flex; align-items: center; justify-content: center;
            border: none; cursor: pointer; flex-shrink: 0;
            font-weight: 900; color: var(--text-brown); font-size: 14px;
            clip-path: path('M35 64c-2 0-3-1-4-2L10 40C5 35 3 29 3 23c0-11 9-20 20-20 5 0 10 3 12 6 2-4 7-6 12-6 11 0 20 9 20 20 0 6-2 12-7 17L37 62c-1 1-1 2-2 2z');
            transition: 0.2s; padding-bottom: 5px;
            position: relative; z-index: 10;
        }
        .heart-btn:active { transform: scale(1.1) rotate(5deg); }

        /* イラスト：ボタンの下に隠れないよう微調整 */
        .onna-illust {
            position: absolute; right: -5px; bottom: -15px;
            width: 85px; height: auto; z-index: 5;
            pointer-events: none; opacity: 0.9;
        }

        /* --- 下部ナビゲーション：他のページと統一 --- */
        .bottom-nav {
            position: fixed; bottom: 15px; left: 0; width: 100%; 
            display: flex; justify-content: center; gap: 50px;
            padding: 0 15px; box-sizing: border-box; z-index: 3000;
            pointer-events: none;
        }
        
        .star-nav-btn {
            text-decoration: none; position: relative; display: flex; 
            align-items: center; justify-content: center;
            width: 70px; height: 70px;
            pointer-events: auto; 
            transition: transform 0.2s;
        }
        .star-icon { font-size: 70px; color: var(--star-yellow); filter: drop-shadow(0 3px 6px rgba(0,0,0,0.1)); }
        .star-label {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -45%);
            font-size: 12px; font-weight: 900; color: #000; white-space: nowrap;
        }
        .star-nav-btn:active { transform: scale(0.9); }

        /* PC向け調整 */
        @media (min-width: 768px) {
            h1 { font-size: 26px; }
            .avatar { width: 75px; height: 75px; }
            .ai-bubble, .user-bubble { font-size: 16px; }
            .input-section { bottom: 140px; }
            .input-card { padding: 12px 20px; }
            textarea { height: 55px; font-size: 16px; }
            
            .heart-btn { 
                width: 100px; height: 100px; font-size: 18px; 
                clip-path: path('M50 90c-2 0-4-1-5-2L14 58C7 51 4 42 4 33 4 16 16 4 32 4c7 0 14 4 18 9 4-5 11-9 18-9 16 0 28 12 28 29 0 9-3 18-9 25L53 88c-1 1-2 2-3 2z');
                padding-bottom: 8px;
            }
            .onna-illust { width: 120px; right: -20px; }
            
            .star-nav-btn { width: 100px; height: 100px; }
            .star-icon { font-size: 100px; }
            .star-label { font-size: 18px; }
            .bottom-nav { left: 50%; transform: translateX(-50%); max-width: 800px; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="header-area">
            <img src="{% static 'images/stepia_icon_clean_transparent.png' %}" class="header-logo" alt="ロゴ">
            <h1>AI相談室</h1>
        </div>

        <div class="chat-container">
            <div class="ai-row">
                <img src="{% static 'images/otoko.png' %}" class="avatar">
                <div class="ai-bubble">
                    {% if ai_answer %}
                        {{ ai_answer|linebreaksbr }}
                    {% else %}
                        こんにちは！何かお悩みはありますか？<br>私に何でも話してくださいね。
                    {% endif %}
                </div>
            </div>

            {% if user_q %}
            <div class="user-row">
                <div class="user-bubble">{{ user_q }}</div>
            </div>
            {% endif %}
        </div>

        <div class="input-section">
            <div class="input-card">
                <form method="post" style="display: contents;">
                    {% csrf_token %}
                    <textarea name="user_input" placeholder="お悩みを入力してね..." required></textarea>
                    <button type="submit" class="heart-btn">相談</button>
                </form>
                <img src="{% static 'images/onna.png' %}" class="onna-illust">
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="{% url 'menu' %}" class="star-nav-btn">
            <span class="star-icon">★</span>
            <span class="star-label">ホーム</span>
        </a>
        <a href="{% url 'mypage' %}" class="star-nav-btn">
            <span class="star-icon">★</span>
            <span class="star-label">履歴</span>
        </a>
    </div>

</body>
</html>
