{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>予約完了 - ステッピア</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #DCECCF; /* ステッピア基本色：薄緑 */
            --white: #FFFFFF;
            --brown: #5D4037;
            --star-yellow: #FFF2AF;
            --star-shadow: #E6D58E;
        }

        body {
            background-color: var(--bg);
            margin: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            text-align: center;
            color: var(--brown);
        }

        .done-card {
            background: var(--white);
            border-radius: 45px;
            padding: 40px 20px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 装飾用のスタイル(.celebration-icon)を削除しました */

        .done-icon-img {
            width: 140px;
            height: auto;
            margin-bottom: 25px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.06));
            /* 装飾がなくなった分、少し上部の余白を調整 */
            margin-top: 10px; 
        }

        h1 {
            font-size: 22px;
            font-weight: 900;
            margin: 0 0 20px 0;
            line-height: 1.5;
        }

        .message {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 40px;
            line-height: 1.7;
            opacity: 0.8;
        }

        .home-btn {
            display: block;
            width: 100%;
            max-width: 280px;
            background: var(--star-yellow);
            color: var(--brown);
            text-decoration: none;
            padding: 18px 0;
            border-radius: 50px;
            font-weight: 900;
            font-size: 18px;
            box-shadow: 0 5px 0 var(--star-shadow);
            transition: all 0.2s;
        }

        .home-btn:hover {
            transform: translateY(2px);
            box-shadow: 0 3px 0 var(--star-shadow);
        }

        .home-btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        @media (min-width: 768px) {
            .done-card {
                max-width: 550px;
                padding: 60px 40px;
            }
            .done-icon-img {
                width: 180px;
                margin-top: 20px; /* PCでの余白調整 */
            }
            h1 { font-size: 28px; }
            .message { font-size: 17px; }
        }
    </style>
</head>
<body>
    <div class="done-card">
        <img src="{% static 'images/stepia_icon_clean_transparent.png' %}" class="done-icon-img" alt="予約完了">
        
        <h1>コンサル予約が<br>完了しました！</h1>
        
        <p class="message">
            当日、お会いできるのを<br>楽しみにしています。<br>
            詳細はマイページでもご確認いただけます。
        </p>
        
        <a href="{% url 'menu' %}" class="home-btn">TOPメニューに戻る</a>
    </div>
</body>
</html>
