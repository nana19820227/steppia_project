{% load static %}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ステッピア - TOP</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    
</head>
<body>

    <div class="container">
        <img src="{% static 'images/stepia_icon_clean_transparent.png' %}" alt="ステッピア ロゴ" class="top-logo">
        
        <h1>ステッピア</h1>
<style>
    :root {
        --bg-green: #DCECCF;
        --card-beige: #F2EFE5;
        --text-brown: #5D4037;
        --btn-white: rgba(255, 255, 255, 0.8);
    }

    body {
        background-color: var(--bg-green);
        font-family: 'Zen Maru Gothic', sans-serif;
        margin: 0;
        /* 画面の高さ100%に固定し、はみ出しを隠す */
        height: 100dvh;
        overflow: hidden; 
        display: flex;
        flex-direction: column;
        color: var(--text-brown);
        box-sizing: border-box;
    }

    .container {
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
        padding: 15px; /* 全体の余白を少し詰める */
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
    }

    /* ロゴをコンパクトに調整 */
    .top-logo {
        width: 80px; /* 180pxから大幅に縮小 */
        height: auto;
        margin-bottom: 5px;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    h1 {
        font-size: 20px; /* タイトルも少し小さく */
        font-weight: 900;
        margin: 0 0 15px 0;
        letter-spacing: 0.1em;
        flex-shrink: 0;
    }

    /* 今日の一言カード：高さを抑える */
    .daily-card {
        background-color: var(--card-beige);
        border-radius: 20px;
        padding: 15px 20px;
        margin-bottom: 15px;
        text-align: left;
        box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        width: 100%;
        box-sizing: border-box;
        flex-shrink: 0; /* 潰れないように固定 */
    }

    .card-title {
        font-size: 13px;
        font-weight: 900;
        margin: 0 0 5px 0;
    }

    .card-message {
        font-size: 14px;
        font-weight: 700;
        line-height: 1.4;
        margin: 0;
    }

    /* メニューリスト：画面の高さに合わせて自動調整 */
    .menu-list {
        display: flex;
        flex-direction: column;
        gap: 8px; /* 間隔を狭める */
        width: 100%;
        flex: 1; /* 余ったスペースを埋める */
        overflow-y: auto; /* 万が一入り切らない場合だけここをスクロール */
        padding-bottom: 10px;
    }

    .menu-link {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--btn-white);
        padding: 12px; /* ボタンの高さを抑える */
        border-radius: 12px;
        text-decoration: none;
        color: var(--text-brown);
        font-size: 15px; /* 文字サイズを調整 */
        font-weight: 900;
        transition: all 0.2s;
        box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        min-height: 44px; /* タップしやすい最小サイズ */
    }

    .menu-link:active {
        transform: scale(0.98);
        background-color: #fff;
    }

    /* ログアウト等：最下部に固定 */
    .footer-links {
        margin-top: auto;
        padding-top: 10px;
        font-size: 11px;
        flex-shrink: 0;
    }
    .footer-links form { display: inline; }
    .footer-links button, .footer-links a {
        color: #888;
        background: none;
        border: none;
        text-decoration: underline;
        cursor: pointer;
    }
</style>
        <div class="daily-card">
            <p class="card-title">今日の一言カード</p>
            <p class="card-message" id="daily-quote">
                読み込み中...
            </p>
        </div>

        <div class="menu-list">
            <a href="{% url 'ai_consult' %}" class="menu-link">AI相談室</a>
            <a href="{% url 'consult_top' %}" class="menu-link">コンサル相談室</a>
            <a href="{% url 'work_tracker' %}" class="menu-link">お仕事ログ（給付管理）</a>
            <a href="{% url 'roulette' %}" class="menu-link">🎁 運試しルーレット</a>
            <a href="{% url 'job_list' %}" class="menu-link">お試しインターン</a>
            <a href="{% url 'progress' %}" class="menu-link">冒険マップ（進捗管理）</a>
            <a href="{% url 'schedule' %}" class="menu-link">スケジュール</a>
            <a href="{% url 'mypage' %}" class="menu-link">マイページ</a>
        </div>

        <div class="footer-links">
            {% if user.is_authenticated %}
                <p>ログイン中: {{ user.username }}</p>
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit">ログアウト</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">管理者ログイン</a>
            {% endif %}
        </div>
    </div>

    <script>
        const quotes = [
            "迷っても大丈夫。あなたは今日も前に進んでいます。",
            "あなたのペースで大丈夫。一歩ずつ歩んでいきましょう。",
            "失敗は成長の種。今日の経験が未来の力になります。",
            "自分を信じて。あなたは素晴らしい可能性を持っています。",
            "休息も大切な準備。今日は心と体をゆっくり休めましょう。",
            "小さな成功を積み重ねて。それが大きな成果に繋がります。",
            "周りと比べなくていい。昨日の自分を一歩超えていこう。",
            "あなたの努力を 誰かが必ず見ています。",
            "新しい道は、一歩踏み出す勇気から始まります。",
            "笑顔は最高のエネルギー。今日も一日を大切に。",
            "焦らず、まずは深呼吸。答えはきっと見つかります。",
            "完璧じゃなくていい。今できる最善を尽くすことが大切です。",
            "あなたの「好き」を大切に。それが一番の強みになります。",
            "支え合える仲間がいます。一人で抱え込まないで。",
            "輝く未来は、今のあなたの手の中にあります。"
        ];

        function setDailyQuote() {
            const now = new Date();
            const dateNumber = now.getFullYear() + now.getMonth() + now.getDate();
            const index = dateNumber % quotes.length;
            const quoteElement = document.getElementById('daily-quote');
            quoteElement.innerText = quotes[index];
        }

        window.onload = setDailyQuote;
    </script>

</body>
</html>
