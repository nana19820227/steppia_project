{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ job.title }} - 詳細 | ステッピア</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --grass: #DCECCF; 
            --wood: #6D4C41; 
            --beige: #F9F5EB; 
            --star-yellow: #F8E796; 
            --apply-pink: #FFD1D1;
        }
        
        body { 
            background-color: var(--grass); 
            font-family: 'Zen Maru Gothic', sans-serif; 
            margin: 0; 
            padding: 12px 10px 100px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100dvh; 
        }

        .container { width: 100%; max-width: 550px; display: flex; flex-direction: column; align-items: center; }

        .top-logo { 
            width: 100%;
            max-width: 110px; 
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.05)); 
            margin-bottom: 12px; 
        }

        .detail-card {
            background: white; 
            padding: 15px; 
            border-radius: 25px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.06); 
            border: 1.5px solid #fff;
            width: 100%; 
            box-sizing: border-box;
            text-align: left;
        }

        .job-title { 
            font-size: 18px; 
            color: #2E7D32; 
            font-weight: 900; 
            margin: 0 0 8px 0; 
            border-left: 5px solid #2E7D32; 
            padding-left: 10px; 
            line-height: 1.3;
        }

        .company-name { 
            font-size: 14px; 
            font-weight: 900; 
            color: #666; 
            margin-bottom: 15px; 
            border-bottom: 1.5px dashed var(--grass); 
            padding-bottom: 8px; 
        }

        .info-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
        .tag { 
            background: var(--beige); 
            padding: 6px 12px; 
            border-radius: 10px; 
            font-weight: 900; 
            color: var(--wood); 
            font-size: 13px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            width: fit-content;
        }

        .description-box { 
            background: #fdfdfd; 
            padding: 12px; 
            border-radius: 15px; 
            border: 1.5px solid #f0f0f0; 
            margin-top: 5px;
        }

        .section-label { 
            color: #2E7D32; 
            font-weight: 900; 
            font-size: 14px; 
            margin-bottom: 10px; 
            border-bottom: 1.5px solid #B9D9A0; 
            display: inline-block; 
        }

        .description-text { 
            line-height: 1.5; 
            color: #333; 
            font-weight: 700; 
            font-size: 14px; 
            text-align: left; 
            white-space: pre-wrap; 
            display: block;
        }

        .apply-section {
            margin-top: 20px;
            text-align: center;
            border-top: 1.5px dashed #DCECCF;
            padding-top: 20px;
        }
        .apply-message {
            font-weight: 900;
            color: var(--wood);
            margin-bottom: 12px;
            font-size: 14px;
        }
        
        .apply-heart-btn {
            width: 85px; height: 85px;
            background-color: var(--apply-pink);
            border: none;
            /* スマホ用のハート */
            clip-path: path('M42 75c-2 0-3-1-4-2L12 48C6 42 4 35 4 28c0-13 10-23 23-23 6 0 12 3 15 7 3-4 9-7 15-7 13 0 23 10 23 23 0 7-2 14-8 20l-27 25c-1 1-2 2-3 2z');
            display: inline-flex;
            align-items: center; 
            justify-content: center;
            text-decoration: none; 
            color: #333; 
            font-weight: 900; 
            font-size: 14px;
            cursor: pointer; 
            transition: 0.2s;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.1));
        }
        .apply-heart-btn:active { transform: scale(1.1) rotate(5deg); }
        .heart-text { margin-top: -8px; }

        .footer-nav { position: fixed; bottom: 12px; left: 12px; z-index: 1000; }
        .star-back-btn {
            width: 65px; 
            height: 65px; 
            background-color: var(--star-yellow);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            display: flex; 
            align-items: center; 
            justify-content: center;
            text-decoration: none; 
            color: #333; 
            font-weight: 900; 
            font-size: 14px;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.1)); 
            transition: 0.2s;
            position: relative;
        }
        .star-back-btn:active { transform: scale(0.9) rotate(-10deg); }
        .nav-text { position: absolute; top: 52%; left: 50%; transform: translate(-50%, -50%); white-space: nowrap; }

        /* --- タブレット・PC向け調整 --- */
        @media (min-width: 768px) {
            .container { max-width: 650px; } /* PCでは少し幅を持たせる */
            .detail-card { padding: 30px; border-radius: 40px; }
            .job-title { font-size: 24px; padding-left: 15px; }
            .company-name { font-size: 16px; }
            .description-text { font-size: 16px; }
            
            /* 🆕 PC用のハート：サイズに合わせてパスの数値を再計算 */
            .apply-heart-btn { 
                width: 110px; 
                height: 110px; 
                font-size: 18px; 
                clip-path: path('M55 100c-3 0-5-1-6-3L15 65C8 57 5 48 5 38 5 20 18 6 35 6c8 0 15 4 20 10 5-6 12-10 20-10 17 0 30 14 30 32 0 10-3 19-10 27l-34 32c-2 2-4 3-6 3z');
            }
            
            /* 星ボタンもPCサイズで中央寄せ気味に */
            .star-back-btn { width: 90px; height: 90px; font-size: 18px; }
            .footer-nav { left: 50%; transform: translateX(-400px); bottom: 25px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="{% static 'images/stepia_icon_clean_transparent.png' %}" class="top-logo" alt="ロゴ">
        
        <div class="detail-card">
            <h1 class="job-title">{{ job.title }}</h1>
            <p class="company-name">🏢 {{ job.company_name }}</p>
            
            <div class="info-row">
                <span class="tag">📍 勤務地：{{ job.location }}</span>
                <span class="tag">💰 給与　：{{ job.salary }}</span>
            </div>
            
            <div class="description-box">
                <div class="section-label">┃ お仕事の内容</div>
                <div class="description-text">{{ job.description|linebreaksbr }}</div>
            </div>

            <div class="apply-section">
                <p class="apply-message">やってみたいかも？</p>
                <a href="{% url 'apply_to_job' job.pk %}" class="apply-heart-btn">
                    <span class="heart-text">応募！</span>
                </a>
            </div>
        </div>

        <div class="footer-nav">
            <a href="{% url 'job_list' %}" class="star-back-btn">
                <span class="nav-text">戻る</span>
            </a>
        </div>
    </div>
</body>
</html>
