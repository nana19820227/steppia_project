{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ job.title }} - 詳細 | ステッピア</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --grass: #DCECCF; 
            --wood: #6D4C41; 
            --beige: #F9F5EB; 
            --star-yellow: #F8E796; 
            --apply-pink: #FFD1D1;
        }
        
        body { 
            background-color: var(--grass); 
            font-family: 'Zen Maru Gothic', sans-serif; 
            margin: 0; 
            /* 下部ボタンと重ならないよう余白を調整 */
            padding: 15px 10px 120px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100dvh; 
        }

        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; }

        /* ロゴ：140pxに小型化 */
        .top-logo { 
            width: 100%;
            max-width: 140px; 
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.05)); 
            margin-bottom: 15px; 
        }

        /* 詳細カード：余白をスマホ用にスリム化 (50px -> 20px) */
        .detail-card {
            background: white; 
            padding: 20px; 
            border-radius: 30px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.08); 
            border: 2px solid #fff;
            width: 100%; 
            box-sizing: border-box;
            text-align: left;
        }

        /* 求人タイトル：22pxにサイズダウン */
        .job-title { 
            font-size: 22px; 
            color: #2E7D32; 
            font-weight: 900; 
            margin: 0 0 10px 0; 
            border-left: 6px solid #2E7D32; 
            padding-left: 12px; 
            line-height: 1.3;
        }

        /* 会社名：16pxに調整 */
        .company-name { 
            font-size: 16px; 
            font-weight: 900; 
            color: #555; 
            margin-bottom: 20px; 
            border-bottom: 1.5px dashed var(--grass); 
            padding-bottom: 10px; 
        }

        /* タグセクション */
        .info-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 25px; }
        .tag { 
            background: var(--beige); 
            padding: 8px 15px; 
            border-radius: 12px; 
            font-weight: 900; 
            color: var(--wood); 
            font-size: 14px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            width: fit-content;
        }

        /* 内容ボックス */
        .description-box { 
            background: #fdfdfd; 
            padding: 15px; 
            border-radius: 20px; 
            border: 1.5px solid #f0f0f0; 
            margin-top: 5px;
        }

        .section-label { 
            color: #2E7D32; 
            font-weight: 900; 
            font-size: 16px; 
            margin-bottom: 12px; 
            border-bottom: 2px solid #B9D9A0; 
            display: inline-block; 
        }

        /* 説明テキスト：15pxに調整し読みやすく */
        .description-text { 
            line-height: 1.6; 
            color: #333; 
            font-weight: 700; 
            font-size: 15px; 
            text-align: left; 
            white-space: pre-wrap; 
            display: block;
        }

        /* 応募セクション */
        .apply-section {
            margin-top: 30px;
            text-align: center;
            border-top: 2px dashed #DCECCF;
            padding-top: 25px;
        }
        .apply-message {
            font-weight: 900;
            color: var(--wood);
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        /* ハートボタン：100pxに小型化 */
        .apply-heart-btn {
            width: 100px; height: 100px;
            background-color: var(--apply-pink);
            border: none;
            clip-path: path('M50 90c-2 0-3-1-4-2L15 57C8 50 5 41 5 33c0-15 12-27 27-27 7 0 14 3 18 8 4-5 11-8 18-8 15 0 27 12 27 27 0 8-3 17-9 24l-31 30c-1 1-2 2-4 2z');
            display: inline-flex;
            align-items: center; 
            justify-content: center;
            text-decoration: none; 
            color: #333; 
            font-weight: 900; 
            font-size: 16px;
            cursor: pointer; 
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
        }
        .apply-heart-btn:active {
            transform: scale(1.1) rotate(5deg);
            background-color: #ffbaba;
        }
        .heart-text { margin-top: -10px; }

        /* 左下の「戻る」星ボタン：他のページと統一して75pxに設定 */
        .footer-nav { position: fixed; bottom: 15px; left: 15px; z-index: 1000; }
        .star-back-btn {
            width: 75px; 
            height: 75px; 
            background-color: var(--star-yellow);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            display: flex; 
            align-items: center; 
            justify-content: center;
            text-decoration: none; 
            color: #333; 
            font-weight: 900; 
            font-size: 15px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); 
            transition: 0.2s;
            position: relative;
        }
        .star-back-btn:active { transform: scale(0.9) rotate(-10deg); background-color: #ffe066; }
        .nav-text { position: absolute; top: 52%; left: 50%; transform: translate(-50%, -50%); white-space: nowrap; }

        /* タブレット・PC向け調整 */
        @media (min-width: 768px) {
            .detail-card { padding: 40px; }
            .job-title { font-size: 28px; }
            .description-text { font-size: 17px; }
            .apply-heart-btn { width: 130px; height: 130px; font-size: 20px; }
            .star-back-btn { width: 110px; height: 110px; font-size: 20px; }
            .footer-nav { left: 50%; transform: translateX(-350px); bottom: 30px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="{% static 'images/stepia_icon_clean_transparent.png' %}" class="top-logo" alt="ロゴ">
        
        <div class="detail-card">
            <h1 class="job-title">{{ job.title }}</h1>
            <p class="company-name">🏢 {{ job.company }}</p>
            
            <div class="info-row">
                <span class="tag">📍 勤務地：{{ job.location }}</span>
                <span class="tag">💰 給与　：{{ job.salary }}</span>
            </div>
            
            <div class="description-box">
                <div class="section-label">┃ お仕事の内容</div>
                <div class="description-text">{{ job.description|linebreaksbr }}</div>
            </div>

            <div class="apply-section">
                <p class="apply-message">このお仕事、やってみたいかも？</p>
                <a href="{% url 'apply_to_job' job.pk %}" class="apply-heart-btn">
                    <span class="heart-text">応募する！</span>
                </a>
            </div>
        </div>

        <div class="footer-nav">
            <a href="{% url 'job_list' %}" class="star-back-btn">
                <span class="nav-text">戻る</span>
            </a>
        </div>
    </div>
</body>
</html>
