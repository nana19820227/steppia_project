{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運だめし！ - ステッピア</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
</head>
<style>
        :root { 
            --bg: #DCECCF; 
            --white: #FFFFFF; 
            --brown: #5D4037; 
            --star-yellow: #FFF2AF; 
            --text-black: #000000; 
        }

        body { 
            background-color: var(--bg); 
            margin: 0; 
            font-family: 'Zen Maru Gothic', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            /* 100vhではなく100dvhを使用 */
            height: 100dvh; 
            overflow: hidden; 
            padding: 10px;
            box-sizing: border-box;
        }

        h2 { 
            font-size: 22px; /* 少し小さく */
            font-weight: 900; 
            color: var(--brown); 
            margin: 10px 0; 
            flex-shrink: 0;
        }

        /* 🆕 ルーレットのサイズを画面に合わせてレスポンシブに */
        .roulette-container { 
            position: relative; 
            width: min(75vw, 280px); /* 画面の75%か最大280px */
            height: min(75vw, 280px);
            flex-shrink: 0;
        }

        .pointer { 
            position: absolute; 
            top: -10px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 0; 
            height: 0; 
            border-left: 12px solid transparent; 
            border-right: 12px solid transparent; 
            border-top: 20px solid #FF5722; 
            z-index: 100; 
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); 
        }

        canvas { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            border: 6px solid var(--white); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); 
            background-color: white;
        }
        
        @keyframes fast-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spinning { animation: fast-spin 0.3s linear infinite; }

        .status-msg { 
            margin-top: 15px; 
            font-size: 16px; 
            font-weight: 900; 
            color: var(--brown); 
            height: 24px; 
            flex-shrink: 0;
        }

        .controls { 
            margin-top: 15px; 
            display: flex; 
            gap: 12px; 
            flex-shrink: 0;
        }

        .btn { 
            padding: 10px 25px; 
            border: none; 
            border-radius: 50px; 
            font-size: 16px; 
            font-weight: 900; 
            cursor: pointer; 
            transition: 0.2s; 
            box-shadow: 0 4px 0 rgba(0,0,0,0.1); 
        }

        .btn:active { transform: translateY(2px); box-shadow: none; }
        .btn:disabled { opacity: 0.4; }
        
        .start-btn { background: #FFA726; color: white; }
        .stop-btn { background: #F48FB1; color: white; }

        /* 🆕 戻るボタンをコンパクトにして右下に配置 */
        .bottom-nav { 
            margin-top: auto; 
            align-self: flex-start; /* 左側に寄せる */
            padding-bottom: 5px;
        }

        .star-link-btn { 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 70px; /* 100pxから70pxへ */
            height: 70px; 
            text-decoration: none; 
        }

        .star-icon { 
            font-size: 70px; 
            color: var(--star-yellow); 
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); 
        }

        .star-text { 
            position: absolute; 
            font-size: 14px; 
            font-weight: 900; 
            color: var(--text-black); 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -45%); 
        }
    </style>
<body>
    <h2>🎁 運だめしルーレット</h2>

    <div class="roulette-container">
        <div class="pointer"></div>
        <canvas id="canvas" width="350" height="350"></canvas>
    </div>

    <div id="status-msg" class="status-msg">
        {% if can_spin %}スタートを押してね！{% else %}今日はもう回したよ。また明日ね！{% endif %}
    </div>

    <div class="controls">
        <button id="startBtn" onclick="startRoulette()" class="btn start-btn" {% if not can_spin %}disabled{% endif %}>スタート</button>
        <button id="stopBtn" onclick="stopRoulette()" class="btn stop-btn" disabled>ストップ</button>
    </div>

    <div class="bottom-nav">
        <a href="{% url 'menu' %}" class="star-link-btn">
            <span class="star-icon">★</span>
            <span class="star-text">戻る</span>
        </a>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusMsg = document.getElementById('status-msg');
        
        const labels = ["特賞", "コンサル面談30分", "A賞", "ハズレ", "B賞", "ハズレ"];
        const colors = ["#FFF9C4", "#B9D9A0", "#FFCCBC", "#F1F8E9", "#F3E5F5", "#ECEFF1"];
        
        let isSpinning = false;

        function drawRoulette() {
            const numSegments = labels.length;
            const angleStep = (2 * Math.PI) / numSegments;
            for (let i = 0; i < numSegments; i++) {
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(175, 175);
                ctx.arc(175, 175, 175, i * angleStep, (i + 1) * angleStep);
                ctx.fill();
                ctx.save();
                ctx.translate(175, 175);
                ctx.rotate(i * angleStep + angleStep / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#5D4037";
                ctx.font = "bold 18px 'Zen Maru Gothic'";
                ctx.fillText(labels[i], 160, 8);
                ctx.restore();
            }
        }

        function startRoulette() {
            if (isSpinning) return;
            isSpinning = true;
            statusMsg.innerText = "何が当たるかな...？";
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            
            canvas.style.transition = "none";
            canvas.classList.add('spinning');
        }

        function stopRoulette() {
            if (!isSpinning) return;
            isSpinning = false;
            document.getElementById('stopBtn').disabled = true;

            // 高速回転を止めて、ランダムな位置まで滑らかに回転させる
            const extraDegree = Math.floor(Math.random() * 360);
            const finalRotation = 1440 + extraDegree; // 4回転 + ランダム角
            
            canvas.classList.remove('spinning');
            canvas.style.transition = 'transform 4s cubic-bezier(0.15, 0, 0.15, 1)';
            canvas.style.transform = `rotate(${finalRotation}deg)`;

            statusMsg.innerText = "ドキドキ……";

            setTimeout(() => {
                const numSegments = labels.length;
                const actualDegree = finalRotation % 360;
                // 針（真上=270度）の位置から当選項目を計算
                const index = Math.floor(((270 - actualDegree + 360) % 360) / (360 / numSegments));
                const resultItem = labels[index];

                statusMsg.innerText = `結果は「${resultItem}」！`;

                // 🆕 当たりなら紙吹雪を飛ばす
                if (!resultItem.includes("ハズレ")) {
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                }

                // 🆕 確実に結果を保存するために1.5秒後にジャンプ
                setTimeout(() => {
                    const targetUrl = `/roulette/result/${encodeURIComponent(resultItem)}/`;
                    window.location.href = targetUrl;
                }, 1500);

            }, 4000);
        }

        drawRoulette();
    </script>
</body>
</html>
