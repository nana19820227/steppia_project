{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コンサル予約 - ステッピア</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* ステッピア共通のデザイン定義（色彩プロレベル） */
        :root {
            --bg: #DCECCF; /* 那奈さんアプリ指定色 */
            --white: #FFFFFF;
            --text-brown: #5D4037; /* 優しい茶色の文字 */
            --btn-green: #81C784; /* 予約ボタンの緑 */
            --btn-green-shadow: #66BB6A;
            --star-yellow: #FFF2AF; /* 戻るボタンの星の色 */
            --text-black: #000000;  /* 星の中の文字色 */
        }
        body {
            background-color: var(--bg);
            font-family: 'Zen Maru Gothic', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-brown);
            overflow-x: hidden;
        }

        /* 🏠 メインの予約カード */
        .reservation-card {
            background: var(--white);
            width: 90%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            z-index: 10; /* 星ボタンより背面に配置 */
        }

        /* ロゴ画像 */
        .app-logo { width: 160px; margin-bottom: 15px; }

        h2 { font-size: 24px; font-weight: 900; margin-bottom: 30px; }

        /* 入力エリアのスタイル */
        .form-group { margin-bottom: 25px; text-align: left; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: 900; font-size: 16px; }
        
        input[type="date"], input[type="time"] {
            width: 100%; padding: 15px;
            border-radius: 20px; border: 2px solid #eee;
            background: #F9F9F9; font-family: inherit; font-size: 16px; font-weight: 700;
            box-sizing: border-box; outline: none; transition: 0.3s; appearance: none; color: var(--text-brown);
        }
        input:focus { border-color: var(--btn-green); background: var(--white); }

        /* 予約ボタン（マイページと統一） */
        .submit-btn {
            width: 100%; padding: 18px; margin-top: 10px;
            border: none; border-radius: 25px;
            background: var(--btn-green); color: white;
            font-size: 20px; font-weight: 900; cursor: pointer;
            box-shadow: 0 5px 0 var(--btn-green-shadow); transition: 0.1s;
        }
        .submit-btn:active { transform: translateY(4px); box-shadow: none; }

        /* --- 戻るボタン（画面左下に固定） --- */
        .bottom-nav { 
            position: fixed; 
            bottom: 30px; 
            left: 30px; 
            z-index: 1000; 
        }
        .star-link-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 140px; 
            height: 140px;
            text-decoration: none;
        }
        .star-icon {
            font-size: 140px;
            color: var(--star-yellow);
            filter: drop-shadow(0 6px 15px rgba(0,0,0,0.12));
        }
        .star-text {
            position: absolute;
            font-size: 28px;
            font-weight: 900;
            color: var(--text-black);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -45%);
        }

        /* 🆕 携帯（スマホ）向けの調整：画面を圧迫しないサイズへ */
        @media (max-width: 480px) {
            .bottom-nav {
                bottom: 15px;
                left: 10px;
            }
            .star-link-btn {
                width: 80px; 
                height: 80px;
            }
            .star-icon {
                font-size: 80px;
            }
            .star-text {
                font-size: 16px; 
            }
            .reservation-card { padding: 35px 20px; }
        }
    </style>
</head>
<body>

    <div class="reservation-card">
        <img src="{% static 'images/stepia_icon_clean_transparent.png' %}" class="app-logo" alt="Steppia">
        <h2>コンサル予約</h2>

        <form method="post" action="{% url 'consult_reservation_done' %}">
            {% csrf_token %}
            <input type="hidden" name="coupon_id" value="{{ request.GET.coupon_id }}">
            <input type="hidden" name="consultant" value="{{ request.session.selected_consultant|default:'担当コンサルタント' }}">

            <div class="form-group">
                <label>📅 希望する日付</label>
                <input type="date" name="date" required>
            </div>
            <div class="form-group">
                <label>⏰ 希望する開始時間</label>
                <input type="time" name="time" required>
            </div>
            <button type="submit" class="submit-btn">この内容で予約する</button>
        </form>
    </div>

    <div class="bottom-nav">
        <a href="{% url 'menu' %}" class="star-link-btn">
            <span class="star-icon">★</span>
            <span class="star-text">戻る</span>
        </a>
    </div>

</body>
</html>
