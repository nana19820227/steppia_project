{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>コンサル予約 - ステッピア</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #DCECCF;
            --white: #FFFFFF;
            --text-brown: #5D4037;
            --btn-green: #81C784;
            --btn-green-shadow: #66BB6A;
            --star-yellow: #FFF2AF;
            --text-black: #000000;
        }

        body {
            background-color: var(--bg);
            font-family: 'Zen Maru Gothic', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100dvh;
            color: var(--text-brown);
            /* 下部ボタンと重ならないよう余白を調整 */
            padding: 20px 15px 120px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* メインカード：スマホに合わせてサイズと余白をスリム化 */
        .reservation-card {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            text-align: center;
            z-index: 10;
            box-sizing: border-box;
        }

        /* ロゴをコンパクトに (150px -> 120px) */
        .app-logo { width: 120px; height: auto; margin-bottom: 5px; }
        
        /* 見出しをサイズダウン (24px -> 20px) */
        h2 { font-size: 20px; font-weight: 900; margin: 0 0 25px; letter-spacing: 0.05em; }

        /* 入力フォーム：間隔を少し詰める */
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 900; font-size: 14px; }
        
        input[type="date"], input[type="time"] {
            width: 100%; padding: 12px 15px;
            border-radius: 15px; border: 2px solid #eee;
            background: #F9F9F9; font-family: inherit; font-size: 16px; font-weight: 700;
            box-sizing: border-box; outline: none; transition: 0.3s; color: var(--text-brown);
            -webkit-appearance: none; /* iOS対策 */
        }
        input:focus { border-color: var(--btn-green); background: var(--white); }

        /* 予約ボタン：高さを抑えてスッキリ */
        .submit-btn {
            width: 100%; padding: 15px; margin-top: 5px;
            border: none; border-radius: 20px;
            background: var(--btn-green); color: white;
            font-size: 18px; font-weight: 900; cursor: pointer;
            box-shadow: 0 4px 0 var(--btn-green-shadow); transition: 0.1s;
        }
        .submit-btn:active { transform: translateY(2px); box-shadow: none; }

        /* --- 下部ナビゲーション：他のページとサイズを統一 (75px) --- */
        .bottom-nav {
            position: fixed; bottom: 15px; left: 15px; width: auto; 
            display: flex; justify-content: flex-start;
            z-index: 1000;
            pointer-events: none;
        }
        
        .star-btn {
            text-decoration: none; position: relative; display: flex; 
            align-items: center; justify-content: center;
            width: 75px; height: 75px;
            pointer-events: auto; 
            transition: transform 0.2s ease-out;
        }

        .star-icon { 
            font-size: 75px; color: var(--star-yellow); 
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.1)); line-height: 1;
        }

        .star-text {
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -45%);
            font-size: 15px; font-weight: 900; 
            color: #000; 
            white-space: nowrap;
            transition: transform 0.15s ease-out;
        }

        .star-btn:active .star-text {
            transform: translate(-40%, -60%) rotate(15deg);
        }

        .star-btn:active {
            transform: scale(0.95);
        }

        /* PC・タブレット向けのサイズ調整 */
        @media (min-width: 768px) {
            .reservation-card { padding: 40px 30px; }
            h2 { font-size: 24px; }
            .app-logo { width: 140px; }
            .star-btn { width: 110px; height: 110px; }
            .star-icon { font-size: 110px; }
            .star-text { font-size: 20px; }
            .bottom-nav { left: 50%; transform: translateX(-350px); bottom: 30px; }
        }
    </style>
</head>
<body>

    <div class="reservation-card">
        <img src="{% static 'images/stepia_icon_clean_transparent.png' %}" class="app-logo" alt="Steppia">
        <h2>コンサル予約</h2>

        <form method="post" action="{% url 'consult_reservation_done' %}">
            {% csrf_token %}
            <input type="hidden" name="coupon_id" value="{{ request.GET.coupon_id }}">
            <input type="hidden" name="consultant" value="{{ request.session.selected_consultant|default:'担当コンサルタント' }}">

            <div class="form-group">
                <label>📅 希望する日付</label>
                <input type="date" name="date" required>
            </div>
            <div class="form-group">
                <label>⏰ 希望する開始時間</label>
                <input type="time" name="time" required>
            </div>
            <button type="submit" class="submit-btn">この内容で予約する</button>
        </form>
    </div>

    <div class="bottom-nav">
        <a href="{% url 'menu' %}" class="star-btn">
            <span class="star-icon">★</span>
            <span class="star-text">戻る</span>
        </a>
    </div>

</body>
</html>
