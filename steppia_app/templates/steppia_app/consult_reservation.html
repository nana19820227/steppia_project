{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コンサル予約 - ステッピア</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #DCECCF;
            --white: #FFFFFF;
            --text-brown: #5D4037;
            --btn-green: #81C784;
            --btn-green-shadow: #66BB6A;
            --star-yellow: #FFF2AF; /* AI相談室と同じ色 */
            --text-black: #000000;
        }

        body {
            background-color: var(--bg);
            font-family: 'Zen Maru Gothic', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-brown);
            overflow-x: hidden;
        }

        /* メインカード */
        .reservation-card {
            background: var(--white);
            width: 90%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            z-index: 10;
        }

        .app-logo { width: 150px; margin-bottom: 10px; }
        h2 { font-size: 24px; font-weight: 900; margin-bottom: 30px; }

        /* 入力フォーム */
        .form-group { margin-bottom: 25px; text-align: left; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: 900; font-size: 16px; }
        
        input[type="date"], input[type="time"] {
            width: 100%; padding: 15px;
            border-radius: 20px; border: 2px solid #eee;
            background: #F9F9F9; font-family: inherit; font-size: 16px; font-weight: 700;
            box-sizing: border-box; outline: none; transition: 0.3s; color: var(--text-brown);
        }
        input:focus { border-color: var(--btn-green); background: var(--white); }

        .submit-btn {
            width: 100%; padding: 18px; margin-top: 10px;
            border: none; border-radius: 25px;
            background: var(--btn-green); color: white;
            font-size: 20px; font-weight: 900; cursor: pointer;
            box-shadow: 0 5px 0 var(--btn-green-shadow); transition: 0.1s;
        }
        .submit-btn:active { transform: translateY(4px); box-shadow: none; }

        /* --- 🆕 下部ナビゲーション：AI相談室と完全同期 --- */
        .bottom-nav {
            position: fixed; bottom: 10px; left: 0; width: 100%; 
            display: flex; justify-content: flex-start; /* 予約画面は「戻る」のみなので左寄せ */
            padding: 0 10px; box-sizing: border-box; z-index: 1000;
            pointer-events: none; /* 背後の要素をクリックできるように */
        }
        
        .star-btn {
            text-decoration: none; position: relative; display: flex; 
            align-items: center; justify-content: center;
            width: 130px; height: 130px;
            pointer-events: auto; 
            transition: transform 0.2s ease-out;
        }

        .star-icon { 
            font-size: 135px; color: var(--star-yellow); 
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.15)); line-height: 1;
        }

        .star-text {
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -45%) rotate(0deg);
            font-size: 22px; font-weight: 900; 
            color: #000; 
            white-space: nowrap;
            transition: transform 0.15s ease-out;
        }

        /* 【重要】クリック時の「クイっ」とした動きを同期 */
        .star-btn:active .star-text {
            transform: translate(-40%, -65%) rotate(15deg);
        }

        .star-btn:active {
            transform: scale(0.95);
        }

        /* 画面が広いPC向けの配置調整 */
        @media (min-width: 1000px) {
            .bottom-nav {
                left: 50%; transform: translateX(-50%);
                max-width: 1200px; padding: 0 30px;
            }
        }

        /* 携帯（スマホ）向けのサイズ調整 */
        @media (max-width: 480px) {
            .star-btn { width: 85px; height: 85px; }
            .star-icon { font-size: 85px; }
            .star-text { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="reservation-card">
        <img src="{% static 'images/stepia_icon_clean_transparent.png' %}" class="app-logo" alt="Steppia">
        <h2>コンサル予約</h2>

        <form method="post" action="{% url 'consult_reservation_done' %}">
            {% csrf_token %}
            <input type="hidden" name="coupon_id" value="{{ request.GET.coupon_id }}">
            <input type="hidden" name="consultant" value="{{ request.session.selected_consultant|default:'担当コンサルタント' }}">

            <div class="form-group">
                <label>📅 希望する日付</label>
                <input type="date" name="date" required>
            </div>
            <div class="form-group">
                <label>⏰ 希望する開始時間</label>
                <input type="time" name="time" required>
            </div>
            <button type="submit" class="submit-btn">この内容で予約する</button>
        </form>
    </div>

    <div class="bottom-nav">
        <a href="{% url 'menu' %}" class="star-btn">
            <span class="star-icon">★</span>
            <span class="star-text">戻る</span>
        </a>
    </div>

</body>
</html>
