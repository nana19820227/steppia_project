{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BEING 冒険マップ - ステッピア</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* --- アニメーション --- */
        @keyframes splash-anim {
            0% { transform: translate(-50%, 0) scale(0.3); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translate(-50%, -80px) scale(1.2); opacity: 0; }
        }
        @keyframes swim-no-flip { 0% { transform: translateX(0); } 50% { transform: translateX(60px); } 100% { transform: translateX(0); } }

        :root { 
            --wood: #6D4C41; --grass: #DCECCF; --sky: #DCECCF; 
            --star-yellow: #FFF2AF; --completed: #FFE082; --text-black: #000000;
        }

        body { 
            background: var(--sky); margin: 0; padding: 0; 
            font-family: 'Zen Maru Gothic', sans-serif; 
            min-height: 100dvh; width: 100%;
            display: flex; justify-content: center; align-items: flex-start;
            overflow-x: hidden; 
        }

        .dollhouse-frame { 
            position: relative; 
            width: 1300px; 
            min-height: 1250px; 
            background: var(--grass); 
            border: 15px solid var(--wood); 
            box-sizing: border-box; 
            margin: auto;
            z-index: 1; 
            padding-bottom: 120px; 
        }

        .header-panel { 
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%); 
            width: 92%; max-width: 800px; 
            background: rgba(255, 255, 255, 0.98); border: 3px solid var(--wood); 
            border-radius: 20px; padding: 12px 15px; z-index: 3000; 
            display: flex; flex-direction: column; align-items: center; gap: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
        }

        .header-top { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .company-controls { 
            display: flex; align-items: center; gap: 8px; width: 100%; 
            padding-top: 5px; border-top: 1px dashed rgba(109, 76, 65, 0.2);
        }

        select { flex-grow: 1; padding: 6px; border-radius: 8px; border: 2px solid var(--wood); font-family: inherit; font-weight: 900; font-size: 12px; color: var(--wood); background: white; }
        .btn-mini { padding: 6px 10px; border-radius: 10px; border: none; font-weight: 900; font-size: 11px; color: white; cursor: pointer; }
        .btn-add { background: #81C784; } .btn-warp { background: #F48FB1; } .btn-del { background: #e57373; }

        .bottom-nav { position: absolute; bottom: 25px; left: 25px; z-index: 4000; }
        .star-link-btn { 
            position: relative; display: flex; align-items: center; justify-content: center; 
            width: 85px; height: 85px; text-decoration: none; transition: transform 0.2s;
        }
        .star-link-btn:active { transform: scale(0.9); }
        .star-icon { font-size: 85px; color: var(--star-yellow); filter: drop-shadow(0 4px 10px rgba(0,0,0,0.1)); }
        .star-text { position: absolute; font-size: 17px; font-weight: 900; color: var(--text-black); top: 50%; left: 50%; transform: translate(-50%, -45%); }

        .step-tile { 
            position: absolute; width: 140px; height: 70px; background: #FFFFFF; 
            border: 2px solid var(--wood); border-radius: 15px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 50; box-shadow: 0 4px 0 rgba(0,0,0,0.05); padding: 0 5px; 
        }
        .step-tile.completed { background: var(--completed); border-color: #FFA000; }
        .player-pawn { position: absolute; width: 60px; z-index: 200; transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); pointer-events: none; }

        .deco-item { position: absolute; pointer-events: none; z-index: 5; }
        .splash { position: absolute; width: 8px; height: 8px; background: white; border-radius: 50%; pointer-events: none; }

        /* 🆕 PCでのデコレーションサイズを調整（一回り小さく） */
        .tree-deco, .buranko-deco { width: 130px; height: auto; }
        .magic-pond { width: 220px; height: 140px; background: #81D4FA; border: 6px solid #FFF; border-radius: 50% 40% 60% 30%; overflow: hidden; }
        .funsui-area { width: 140px; }
        .tobibako-deco { width: 120px; }

        @media (max-width: 768px) {
            .dollhouse-frame { width: 100vw; border-width: 8px; padding-bottom: 100px; }
            .header-panel { width: 95%; padding: 10px; }
            .header-panel h2 { font-size: 12px !important; }
            .bottom-nav { bottom: 20px; left: 15px; }
            .star-link-btn { width: 60px; height: 60px; }
            .star-icon { font-size: 60px; }
            .star-text { font-size: 13px; }
            .tree-deco, .buranko-deco { width: 85px !important; }
            .magic-pond { width: 180px !important; height: 120px !important; }
            .funsui-area { width: 110px !important; }
            .tobibako-deco { width: 90px !important; }
        }
    </style>
</head>
<body>
    <div class="dollhouse-frame" id="main-frame">
        <svg id="path-svg" style="position:absolute; width:100%; height:100%; pointer-events:none; z-index:10;">
            <path id="path-line" fill="none" stroke="rgba(109, 76, 65, 0.15)" stroke-width="5" stroke-dasharray="10,10" />
        </svg>

        <div class="header-panel">
            <div class="header-top">
                <h2 style="font-size: 14px; margin: 0; color: var(--wood);">BEINGを叶える冒険航路</h2>
                <div style="display:flex; align-items:center; gap:5px;">
                    <input type="number" id="warp-val" value="1" min="1" max="30" style="width:35px; border-radius:8px; border:2px solid var(--wood); text-align:center; font-weight:900;">
                    <button onclick="warp()" class="btn-mini btn-warp">移動</button>
                </div>
            </div>
            <div class="company-controls">
                <select id="company-select" onchange="changeCompany(this.value)">
                    <option value="">企業を選択</option>
                </select>
                <button onclick="addCompany()" class="btn-mini btn-add">+追加</button>
                <button onclick="deleteCurrentCompany()" class="btn-mini btn-del">🗑️</button>
            </div>
        </div>

        <div id="pond-deco" class="deco-item magic-pond">
            <img src="{% static 'images/fish.png' %}" style="position:absolute; top:35%; width:35px; animation: swim-no-flip 10s linear infinite;">
        </div>
        <div id="funsui-deco" class="deco-item funsui-area">
            <img src="{% static 'images/funsui.png' %}" style="width:100%; display:block;">
            <div id="splash-container" style="position:absolute; top:20px; left:50%; width:40px; height:20px;"></div>
        </div>
        <img id="tree-deco" src="{% static 'images/midorinoki.png' %}" class="deco-item tree-deco">
        <img id="buranko-deco" src="{% static 'images/buranko.png' %}" class="deco-item buranko-deco">
        <img id="tobibako-deco" src="{% static 'images/tobibako.png' %}" class="deco-item tobibako-deco">
        
        <img src="{% static 'images/onna.png' %}" class="player-pawn" id="pawn" style="display:none;">
        
        <div id="grid-root"></div>

        <div class="bottom-nav">
            <a href="{% url 'menu' %}" class="star-link-btn">
                <span class="star-icon">★</span>
                <span class="star-text">戻る</span>
            </a>
        </div>
    </div>

    <script>
        let companies = JSON.parse(localStorage.getItem('steppia_companies')) || {};
        let currentCompanyId = localStorage.getItem('steppia_current_id') || '';
        const missionNames = ["経験スキルの棚卸し", "コンサル面談①", "価値観の言語化", "強みの明確化", "転職軸確定", "市場調査", "ターゲット選定", "経歴書作成", "コンサル面談②", "志望動機の最適化", "チャネル選定", "応募計画", "エントリー開始", "面談実践", "コンサル面談③", "求人応募", "適性検査対策", "回答案作成", "コンサル面談④", "1次面接挑戦", "書類整理", "🌟お試しインターン挑戦", "コンサル面談⑤", "2次面接挑戦", "企業研究の更なる深掘り", "逆質問準備", "最終面接挑戦", "コンサル面談⑥", "最終面接結果待ち", "🎉内定GET！"];
        let nodePoints = [];

        function renderMap() {
            const root = document.getElementById('grid-root'); 
            const frame = document.getElementById('main-frame');
            root.innerHTML = ''; nodePoints = [];
            
            const isMobile = window.innerWidth < 768;
            const cols = isMobile ? 2 : 6;
            const frameWidth = frame.clientWidth;
            
            const gapX = isMobile ? (frameWidth / 2.3) : 185;
            const gapY = isMobile ? 110 : 140; 
            // 🆕 PCでの開始位置を右にずらしてブランコとの重なりを防止
            const startX = isMobile ? (frameWidth - (gapX * (cols-1) + (isMobile ? 115 : 140))) / 2 : 200;
            const startY = isMobile ? 180 : 220;

            for (let i = 1; i <= 30; i++) {
                const row = Math.floor((i - 1) / cols);
                const col = (i - 1) % cols;
                const isRev = row % 2 !== 0;
                const x = isRev ? (cols - 1 - col) * gapX + startX : col * gapX + startX; 
                const y = row * gapY + startY;

                const tile = document.createElement('div'); 
                tile.className = 'step-tile'; 
                tile.style.left = x + 'px'; 
                tile.style.top = y + 'px';
                if(isMobile) {
                    tile.style.width = '110px'; tile.style.height = '60px';
                }

                tile.innerHTML = `<div style="font-size:8px; opacity:0.6; font-weight:900;">STEP ${i}</div><div style="width:100%; text-align:center; font-weight:900; font-size:10px; color:var(--wood); line-height:1.1;">${missionNames[i-1]}</div>`;
                root.appendChild(tile);
                nodePoints.push({x: x + (isMobile ? 55 : 70), y: y + (isMobile ? 30 : 35)});
            }

            const lastPoint = nodePoints[nodePoints.length - 1];
            const pond = document.getElementById('pond-deco');
            const funsui = document.getElementById('funsui-deco');
            const tobibako = document.getElementById('tobibako-deco');
            const tree = document.getElementById('tree-deco');
            const buranko = document.getElementById('buranko-deco');

            const tobibakoTop = lastPoint.y + (isMobile ? 120 : 160);
            tobibako.style.top = tobibakoTop + 'px';
            tobibako.style.left = "50%"; tobibako.style.transform = "translateX(-50%)";

            const funsuiTop = tobibakoTop + (isMobile ? 180 : 240);
            funsui.style.top = funsuiTop + 'px';
            funsui.style.left = "50%"; funsui.style.transform = "translateX(-50%)";

            pond.style.top = (funsuiTop + (isMobile ? 130 : 180)) + 'px';
            pond.style.left = "50%"; pond.style.transform = "translateX(-50%)";

            if (!isMobile) {
                // 🆕 ブランコをさらに左端に寄せ、サイズも微調整
                tree.style.top = "100px"; tree.style.left = (frameWidth - 180) + "px";
                buranko.style.top = "140px"; buranko.style.left = "30px";
            } else {
                tree.style.top = "110px"; tree.style.left = "10px";
                buranko.style.top = "110px"; buranko.style.right = "10px"; buranko.style.left = "auto";
            }

            frame.style.height = (funsuiTop + (isMobile ? 450 : 600)) + 'px';
            drawPath(); updateView();
        }

        function updateView() {
            const pawn = document.getElementById('pawn');
            const select = document.getElementById('company-select');
            select.innerHTML = '<option value="">企業を選択</option>';
            for (const id in companies) {
                const opt = document.createElement('option');
                opt.value = id; opt.textContent = `${companies[id].name} (S${companies[id].step})`;
                if (id === currentCompanyId) opt.selected = true;
                select.appendChild(opt);
            }
            if (!currentCompanyId || !companies[currentCompanyId]) {
                currentCompanyId = ''; if(pawn) pawn.style.display = 'none';
                document.querySelectorAll('.step-tile').forEach(t => t.classList.remove('completed'));
            } else {
                const step = companies[currentCompanyId].step;
                document.getElementById('warp-val').value = step;
                const p = nodePoints[step - 1];
                if(pawn && p) {
                    pawn.style.display = 'block';
                    pawn.style.left = (p.x - 30) + 'px'; pawn.style.top = (p.y - 75) + 'px';
                }
                document.querySelectorAll('.step-tile').forEach((t, idx) => { t.classList.toggle('completed', idx < step); });
                if (step === 30) { setTimeout(() => { window.location.href = "{% url 'congrats_map' %}"; }, 1500); }
            }
            localStorage.setItem('steppia_companies', JSON.stringify(companies));
            localStorage.setItem('steppia_current_id', currentCompanyId);
        }

        function changeCompany(id) { currentCompanyId = id; updateView(); }
        function addCompany() { const name = prompt("企業名を入力"); if (name) { const id = 'c' + Date.now(); companies[id] = { name: name, step: 1 }; currentCompanyId = id; updateView(); } }
        function deleteCurrentCompany() { if (!currentCompanyId) return; if (confirm(`削除しますか？`)) { delete companies[currentCompanyId]; currentCompanyId = ''; updateView(); } }
        function warp() { if(!currentCompanyId) return; const v = parseInt(document.getElementById('warp-val').value); companies[currentCompanyId].step = v; updateView(); }
        function drawPath() { const line = document.getElementById('path-line'); if(nodePoints.length === 0) return; let d = `M ${nodePoints[0].x} ${nodePoints[0].y}`; for (let i = 1; i < nodePoints.length; i++) { d += ` L ${nodePoints[i].x} ${nodePoints[i].y}`; } line.setAttribute('d', d); }

        function createSplash() { 
            const container = document.getElementById('splash-container'); 
            if(!container) return;
            const splash = document.createElement('div'); 
            splash.className = 'splash'; 
            splash.style.left = `${Math.random() * 100}%`; 
            const duration = Math.random() * 0.5 + 0.5; 
            splash.style.animation = `splash-anim ${duration}s ease-out forwards`; 
            container.appendChild(splash); 
            setTimeout(() => splash.remove(), duration * 1000); 
        }

        window.onload = () => { renderMap(); setInterval(createSplash, 150); };
        window.onresize = renderMap;
    </script>
</body>
</html>
