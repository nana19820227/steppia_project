{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>担当コンサル設定 - ステッピア</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #DCECCF;
            --white: #FFFFFF;
            --brown: #5D4037;
            --text-black: #000000;
            --star-yellow: #FFF2AF;
            --btn-star: #FFD54F;
        }

        body {
            background-color: var(--bg); margin: 0; 
            font-family: 'Zen Maru Gothic', sans-serif; color: var(--brown);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            /* 下部の固定ボタンとの重なりを防ぐ余白 */
            padding: 20px 15px 140px; 
            box-sizing: border-box;
        }
        
        /* ロゴのサイズをスマホに最適化 */
        .app-logo { margin-top: 20px; width: 100%; max-width: 180px; height: auto; }
        
        h1 { 
            font-size: 26px; font-weight: 900; margin: 20px 0 30px; 
            text-align: center; letter-spacing: 0.05em;
        }

        .consultant-list { 
            display: flex; flex-direction: column; gap: 16px; 
            width: 100%; max-width: 500px; 
        }
        
        .consultant-card {
            background: var(--white); border-radius: 30px; padding: 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid rgba(255,255,255,0.8);
            transition: transform 0.2s;
        }

        .consultant-card:active { transform: scale(0.98); }

        .consultant-info { display: flex; align-items: center; gap: 15px; flex: 1; min-width: 0; }
        
        .consultant-img {
            width: 70px; height: 70px; border-radius: 50%;
            object-fit: contain; background: #fdfdfd;
            border: 2px solid #f0f0f0; flex-shrink: 0;
        }
        
        .consultant-details { text-align: left; min-width: 0; flex: 1; }

        .consultant-name { 
            font-size: 18px; font-weight: 900; color: #000; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            line-height: 1.2;
        }

        .consultant-career { 
            font-size: 12px; font-weight: 700; opacity: 0.5; margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* 登録スターボタン */
        .register-btn {
            position: relative; display: flex; align-items: center; justify-content: center;
            width: 65px; height: 65px; background: none; border: none; cursor: pointer;
            padding: 0; margin-left: 10px; flex-shrink: 0;
            transition: transform 0.2s ease-out;
        }
        .register-btn:active { transform: scale(1.2) rotate(10deg); } /* クリック時に少し大きく傾く */
        
        .register-star { font-size: 65px; color: var(--btn-star); filter: drop-shadow(0 3px 6px rgba(0,0,0,0.1)); }
        
        .register-text { 
            position: absolute; font-size: 14px; font-weight: 900; color: #000; 
            top: 50%; left: 50%; transform: translate(-50%, -45%); 
        }

        /* 戻るボタンの固定位置調整 */
        .bottom-nav { position: fixed; bottom: 25px; left: 15px; z-index: 1000; }
        
        .star-link-btn {
            position: relative; display: flex; align-items: center; justify-content: center;
            width: 90px; height: 90px; text-decoration: none;
            transition: transform 0.2s;
        }
        .star-link-btn:active { transform: scale(0.9); }
        
        .star-icon { font-size: 90px; color: var(--star-yellow); filter: drop-shadow(0 4px 10px rgba(0,0,0,0.1)); }
        
        .star-text {
            position: absolute; font-size: 18px; font-weight: 900; color: var(--text-black);
            top: 50%; left: 50%; transform: translate(-50%, -45%);
        }

        /* タブレット・PC向けの調整 */
        @media (min-width: 768px) {
            h1 { font-size: 32px; }
            .consultant-img { width: 85px; height: 85px; }
            .consultant-name { font-size: 22px; }
            .register-btn { width: 75px; height: 75px; }
            .register-star { font-size: 75px; }
            .bottom-nav { left: 50%; transform: translateX(-400px); } /* PC時は中央寄せの左側 */
        }
    </style>
</head>
<body>
    <img src="{% static 'images/stepia_icon_clean_transparent.png' %}" alt="ステッピア ロゴ" class="app-logo">
    
    <h1>担当コンサル設定</h1>

    <form method="post" action="{% url 'consult_setting_done' %}" class="consultant-list">
        {% csrf_token %}
        
        <div class="consultant-card">
            <div class="consultant-info">
                <img src="{% static 'images/c_1.png' %}" alt="小林 香織" class="consultant-img">
                <div class="consultant-details">
                    <div class="consultant-name">小林 香織</div>
                    <div class="consultant-career">カウンセラー歴5年</div>
                </div>
            </div>
            <button type="submit" name="consultant" value="小林 香織" class="register-btn">
                <span class="register-star">★</span><span class="register-text">登録</span>
            </button>
        </div>

        <div class="consultant-card">
            <div class="consultant-info">
                <img src="{% static 'images/c_2.png' %}" alt="山村 雄一" class="consultant-img">
                <div class="consultant-details">
                    <div class="consultant-name">山村 雄一</div>
                    <div class="consultant-career">カウンセラー歴8年</div>
                </div>
            </div>
            <button type="submit" name="consultant" value="山村 雄一" class="register-btn">
                <span class="register-star">★</span><span class="register-text">登録</span>
            </button>
        </div>

        <div class="consultant-card">
            <div class="consultant-info">
                <img src="{% static 'images/c_3.png' %}" alt="和田 五郎" class="consultant-img">
                <div class="consultant-details">
                    <div class="consultant-name">和田 五郎</div>
                    <div class="consultant-career">カウンセラー歴20年</div>
                </div>
            </div>
            <button type="submit" name="consultant" value="和田 五郎" class="register-btn">
                <span class="register-star">★</span><span class="register-text">登録</span>
            </button>
        </div>
    </form>

    <div class="bottom-nav">
        <a href="{% url 'top' %}" class="star-link-btn">
            <span class="star-icon">★</span><span class="star-text">戻る</span>
        </a>
    </div>
</body>
</html>
