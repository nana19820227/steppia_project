{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>担当コンサル設定 - ステッピア</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #DCECCF;
            --white: #FFFFFF;
            --brown: #5D4037;
            --text-black: #000000;
            --star-yellow: #FFF2AF;
            --btn-star: #FFD54F;
        }
        body {
            background-color: var(--bg); margin: 0; 
            font-family: 'Zen Maru Gothic', sans-serif; color: var(--brown);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            /* 下部の固定ボタンと重ならないよう余白を確保 */
            padding: 20px 15px 160px; 
            box-sizing: border-box;
        }
        
        /* 🆕 ロゴと見出しの余白をスマホ用にスリム化 */
        .app-logo { margin-top: 30px; width: 220px; height: auto; }
        h1 { font-size: 32px; font-weight: 900; margin: 15px 0 40px; text-align: center; }

        .consultant-list { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 600px; }
        
        .consultant-card {
            background: var(--white); border-radius: 40px; padding: 20px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            border: 2px solid rgba(255,255,255,0.5);
        }

        .consultant-info { display: flex; align-items: center; gap: 15px; flex: 1; min-width: 0; }
        
        .consultant-img {
            width: 85px; height: 85px; border-radius: 50%;
            object-fit: contain; background: var(--white);
            border: 3px solid #f9f9f9; flex-shrink: 0;
        }
        
        .consultant-details { text-align: left; min-width: 0; flex: 1; }

        .consultant-name { 
            font-size: 22px; font-weight: 900; color: #000; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .consultant-career { font-size: 13px; font-weight: 700; opacity: 0.6; margin-top: 4px; }

        /* 🆕 登録ボタンのサイズをスマホで押しやすく微調整 */
        .register-btn {
            position: relative; display: flex; align-items: center; justify-content: center;
            width: 75px; height: 75px; background: none; border: none; cursor: pointer;
            transition: transform 0.2s; padding: 0; margin-left: 10px; flex-shrink: 0;
        }
        .register-btn:active { transform: scale(0.9); }
        .register-star { font-size: 75px; color: var(--btn-star); filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); }
        .register-text { position: absolute; font-size: 15px; font-weight: 900; color: #000; top: 50%; left: 50%; transform: translate(-50%, -45%); }

        /* 🆕 戻るボタンをスマホで邪魔にならないサイズに */
        .bottom-nav { position: fixed; bottom: 25px; left: 20px; z-index: 1000; }
        .star-link-btn {
            position: relative; display: flex; align-items: center; justify-content: center;
            width: 100px; height: 100px; text-decoration: none;
        }
        .star-icon { font-size: 100px; color: var(--star-yellow); filter: drop-shadow(0 6px 15px rgba(0,0,0,0.12)); }
        .star-text {
            position: absolute; font-size: 20px; font-weight: 900; color: var(--text-black);
            top: 50%; left: 50%; transform: translate(-50%, -45%);
        }

        /* 超小型スマホ向けの最終微調整 */
        @media (max-width: 380px) {
            h1 { font-size: 26px; }
            .consultant-img { width: 70px; height: 70px; }
            .consultant-name { font-size: 18px; }
            .register-btn { width: 65px; height: 65px; }
            .register-star { font-size: 65px; }
            .register-text { font-size: 13px; }
        }
    </style>
</head>
<body>
    <img src="{% static 'images/stepia_icon_clean_transparent.png' %}" alt="ステッピア ロゴ" class="app-logo">
    
    <h1>担当コンサル設定</h1>

    <form method="post" action="{% url 'consult_setting_done' %}" class="consultant-list">
        {% csrf_token %}
        
        <div class="consultant-card">
            <div class="consultant-info">
                <img src="{% static 'images/c_1.png' %}" alt="小林 香織" class="consultant-img">
                <div class="consultant-details">
                    <div class="consultant-name">小林 香織</div>
                    <div class="consultant-career">カウンセラー歴5年</div>
                </div>
            </div>
            <button type="submit" name="consultant" value="小林 香織" class="register-btn">
                <span class="register-star">★</span><span class="register-text">登録</span>
            </button>
        </div>

        <div class="consultant-card">
            <div class="consultant-info">
                <img src="{% static 'images/c_2.png' %}" alt="山村 雄一" class="consultant-img">
                <div class="consultant-details">
                    <div class="consultant-name">山村 雄一</div>
                    <div class="consultant-career">カウンセラー歴8年</div>
                </div>
            </div>
            <button type="submit" name="consultant" value="山村 雄一" class="register-btn">
                <span class="register-star">★</span><span class="register-text">登録</span>
            </button>
        </div>

        <div class="consultant-card">
            <div class="consultant-info">
                <img src="{% static 'images/c_3.png' %}" alt="和田 五郎" class="consultant-img">
                <div class="consultant-details">
                    <div class="consultant-name">和田 五郎</div>
                    <div class="consultant-career">カウンセラー歴20年</div>
                </div>
            </div>
            <button type="submit" name="consultant" value="和田 五郎" class="register-btn">
                <span class="register-star">★</span><span class="register-text">登録</span>
            </button>
        </div>
    </form>

    <div class="bottom-nav">
        <a href="{% url 'top' %}" class="star-link-btn">
            <span class="star-icon">★</span><span class="star-text">戻る</span>
        </a>
    </div>
</body>
</html>
